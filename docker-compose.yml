services:
  cashewnet:

    build: .

    container_name: cashewnet

    runtime: nvidia

    working_dir: /workspace

    stdin_open: true

    tty: true

    volumes:
      - .:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/pip:/root/.cache/pip

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
